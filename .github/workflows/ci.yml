name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 07:00 UTC daily. Tier 3 only - see the `if` on model-tests. Nothing else keys off this.
    - cron: '0 7 * * *'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # Deliberately no `with:` block. native.yml has no bypass input at all, so a pull request
  # that touched no `foundation/native/**` path takes native.yml's `reuse` job, which restores
  # the cached artifacts on one ubuntu runner instead of rebuilding four variants on three
  # operating systems (spec 10.4, adjustment 34).
  natives:
    uses: ./.github/workflows/native.yml
    # native.yml's `reuse` job repairs a missing cache entry by downloading that leg's artifact
    # from the last good run on the default branch, and a called workflow can only NARROW the
    # caller's token - so `actions: read` has to be granted here.
    permissions:
      contents: read
      actions: read

  test:
    needs: natives
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # MinVer needs history, or every package builds as 0.0.0-alpha.0
          filter: tree:0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: foundation/native/artifacts

      # windows-2025 only. The `.slnx` carries three MAUI-only projects (Qavren.Edge.Maui, the
      # sample, DeviceTests) whose every TFM is platform-specific, so a solution restore needs the
      # android/ios/maccatalyst/maui-windows workloads. The windows-2025 image ships them; the
      # ubuntu and macOS images do not, and `ios`/`maccatalyst` cannot be installed on Linux at
      # all - restoring the solution there fails with NETSDK1147. The Windows leg restores every
      # TFM, so it is the strictly larger graph: nothing is lost by asserting only there.
      - name: Assert no SQLitePCLRaw bundle package is in the graph
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          dotnet restore QavrenEdge.slnx
          $hits = Get-ChildItem -Recurse -Filter 'project.assets.json' |
                  Select-String -Pattern 'SQLitePCLRaw\.bundle_' -SimpleMatch
          if ($hits) { throw "A SQLitePCLRaw bundle package is in the graph; 2.x bundles conflict with core 3.x." }
          Write-Host 'OK: no bundle packages'

      # Assertion 1: net10.0 must land on lib/net8.0, never lib/netstandard2.0. A silent fall-back
      # to netstandard2.0 drops System.Numerics.Tensors and changes the span hot path with no error
      # anywhere. Assertion 2: the three UNVERSIONED platform TFMs must resolve ORT's versioned
      # mobile assets. That is the standing regression guard for the claim that the SDK's default
      # TargetPlatformVersion clears ORT's 18.0/35.0 floors without SP2 pinning a versioned TFM -
      # if a future SDK or workload bump lowers a default, this is what catches it, and the
      # documented response is to pin net10.0-ios18.0 / -android35.0 / -maccatalyst18.0 on SP2's
      # projects only.
      - name: Assert ONNX Runtime asset resolution
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $assets = 'embeddings/src/Qavren.Edge.Onnx/obj/project.assets.json'
          if (-not (Test-Path $assets)) { throw "no project.assets.json at $assets" }
          $a = Get-Content $assets -Raw | ConvertFrom-Json
          $expected = [ordered]@{
            'net10.0'             = 'lib/net8.0/Microsoft.ML.OnnxRuntime.dll'
            'net10.0-android'     = 'lib/net9.0-android35.0/Microsoft.ML.OnnxRuntime.dll'
            'net10.0-ios'         = 'lib/net9.0-ios18.0/Microsoft.ML.OnnxRuntime.dll'
            'net10.0-maccatalyst' = 'lib/net9.0-maccatalyst18.0/Microsoft.ML.OnnxRuntime.dll'
          }
          foreach ($tfm in $expected.Keys) {
            $entry = $a.targets.$tfm.'Microsoft.ML.OnnxRuntime.Managed/1.30.0'
            if (-not $entry) { throw "$tfm did not resolve Microsoft.ML.OnnxRuntime.Managed 1.30.0" }
            $got = ($entry.compile.PSObject.Properties.Name) -join ','
            if ($got -ne $expected[$tfm]) {
              throw "$tfm resolved '$got'; expected '$($expected[$tfm])'"
            }
            Write-Host "OK $tfm -> $got"
          }

      # PdfPig ships NO net10.0 TFM and must resolve lib/net9.0 on every TFM. The failure this
      # guards is a static-constructor throw on a device with no compile error anywhere: the
      # netstandard2.0 copy of UglyToad.PdfPig.Fonts.dll contains neither AndroidSystemFontLister
      # nor IOSSystemFontLister and raises NotSupportedException the first time a PDF references
      # a non-embedded font (spec 14.6). Written against the PdfPig id directly - unlike ORT's
      # native package, PdfPig carries its own compile assets, so the assertion is not vacuous.
      - name: Assert PdfPig asset resolution
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $assets = 'ingestion/tests/Qavren.Edge.Ingestion.Extractors.Tests/obj/project.assets.json'
          if (-not (Test-Path $assets)) { throw "no project.assets.json at $assets" }
          $a = Get-Content $assets -Raw | ConvertFrom-Json
          foreach ($tfm in 'net10.0','net10.0-android','net10.0-ios','net10.0-maccatalyst','net10.0-windows10.0.19041.0') {
            $entry = $a.targets.$tfm.'PdfPig/0.1.16'
            if (-not $entry) { throw "$tfm did not resolve PdfPig 0.1.16" }
            $names = $entry.compile.PSObject.Properties.Name
            $bad = $names | Where-Object { $_ -notlike 'lib/net9.0/*' }
            if ($bad) { throw "$tfm resolved PdfPig to '$($bad -join ',')'; expected lib/net9.0" }
            Write-Host "OK $tfm -> lib/net9.0 ($($names.Count) assemblies)"
          }

      # Assertion 1: the GenAI MANAGED package's asset per TFM. Written against
      # Microsoft.ML.OnnxRuntimeGenAI.Managed on purpose: the native Microsoft.ML.OnnxRuntimeGenAI
      # package resolves ZERO compile assets on every TFM (measured), so an assertion written
      # against that id would pass vacuously forever - sub-project 2 adjustment 2's lesson, and the
      # `if ($native.compile)` line below is what makes the trap itself a test.
      - name: Assert ONNX Runtime GenAI asset resolution
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $assets = 'chat/src/Qavren.Edge.Chat.Onnx/obj/project.assets.json'
          if (-not (Test-Path $assets)) { throw "no project.assets.json at $assets" }
          $a = Get-Content $assets -Raw | ConvertFrom-Json
          $expected = [ordered]@{
            'net10.0'             = 'lib/net8.0/Microsoft.ML.OnnxRuntimeGenAI.dll'
            'net10.0-android'     = 'lib/net9.0-android31.0/Microsoft.ML.OnnxRuntimeGenAI.dll'
            'net10.0-ios'         = 'lib/net9.0-ios15.4/Microsoft.ML.OnnxRuntimeGenAI.dll'
            'net10.0-maccatalyst' = 'lib/net9.0-maccatalyst14.0/Microsoft.ML.OnnxRuntimeGenAI.dll'
          }
          foreach ($tfm in $expected.Keys) {
            $m = $a.targets.$tfm.'Microsoft.ML.OnnxRuntimeGenAI.Managed/0.15.2'
            if (-not $m) { throw "$tfm did not resolve Microsoft.ML.OnnxRuntimeGenAI.Managed 0.15.2" }
            $got = ($m.compile.PSObject.Properties.Name) -join ','
            if ($got -ne $expected[$tfm]) { throw "$tfm resolved '$got'; expected '$($expected[$tfm])'" }
            $native = $a.targets.$tfm.'Microsoft.ML.OnnxRuntimeGenAI/0.15.2'
            if ($native.compile) { throw "${tfm}: the native package resolved compile assets; this assertion is scanning the wrong package id" }
            Write-Host "OK $tfm -> $got"
          }

      # Assertion 2: the ORT floor guard. GenAI 0.15.2 declares Microsoft.ML.OnnxRuntime >= 1.28.0
      # - a FLOOR, not a pin - and its native links ORT dynamically, negotiating through
      # OrtApiBase::GetApi, which fails only on an OLDER runtime. This is the guard that stops
      # someone "fixing" the version skew by downgrading ORT to match GenAI's floor.
      - name: Assert the ONNX Runtime floor and pin
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $assets = 'chat/src/Qavren.Edge.Chat.Onnx/obj/project.assets.json'
          $a = Get-Content $assets -Raw | ConvertFrom-Json
          foreach ($tfm in 'net10.0','net10.0-android','net10.0-ios','net10.0-maccatalyst') {
            $id = $a.targets.$tfm.PSObject.Properties.Name | Where-Object { $_ -like 'Microsoft.ML.OnnxRuntime/*' }
            $v  = [version]($id -replace '^.*/','')
            if ($v -lt [version]'1.28.0') { throw "$tfm resolved ORT $v, below GenAI's 1.28.0 floor" }
            if ($v -ne [version]'1.30.0') { throw "$tfm resolved ORT $v; the repo pin is 1.30.0 and GenAI's floor must not move it" }
            Write-Host "OK $tfm -> ORT $v"
          }

      - name: Provider drift check
        run: >
          dotnet run --project foundation/tools/ProviderGen/ProviderGen.csproj -c Release --
          generate
          --manifest foundation/tools/ProviderGen/provider.manifest.json
          --template foundation/src/Qavren.Edge.Sqlite.Provider/Template/provider_internal_funcptrs.cs.template
          --out foundation/src/Qavren.Edge.Sqlite.Provider/Generated/SQLite3Provider_qedge.g.cs
          --check

      - name: Manifest drift check
        run: >
          dotnet run --project foundation/tools/ProviderGen/ProviderGen.csproj -c Release --
          manifest --out foundation/tools/ProviderGen/provider.manifest.json --check

      # Same constraint as the bundle assert above - `dotnet format` loads the whole solution,
      # MAUI projects included - and it consumes that step's restore via --no-restore. Formatting
      # is OS-invariant, so one leg is enough.
      - name: Format check
        if: matrix.os == 'windows-2025'
        run: dotnet format QavrenEdge.slnx --verify-no-changes --no-restore

      - name: Workflow contract check
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 -m pip install --quiet pyyaml
          python3 foundation/tools/ci-checks/assert-workflows.py .

      # -p:TargetFrameworks=net10.0 on every test step, on every OS. `-f net10.0` alone does NOT
      # stop the mobile TFMs from being evaluated: restore still walks the full TargetFrameworks
      # list of the project and of everything it references (Qavren.Edge.Sqlite.Provider and both
      # Native projects are net10.0;net10.0-ios), so the workload check fires for net10.0-ios /
      # net10.0-android on hosts without those workloads. As an MSBuild global property
      # TargetFrameworks overrides the project-declared value and flows across ProjectReference,
      # trimming the graph to the one framework these lanes actually run. Verified locally on SDK
      # 10.0.401 against a project multi-targeting an uninstalled workload.
      - name: Core tests
        run: dotnet run --project foundation/tests/Qavren.Edge.Core.Tests/Qavren.Edge.Core.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0

      - name: Provider tests
        run: dotnet run --project foundation/tests/Qavren.Edge.Provider.Tests/Qavren.Edge.Provider.Tests.csproj -c Release -p:TargetFrameworks=net10.0

      - name: Sqlite tests
        run: dotnet run --project foundation/tests/Qavren.Edge.Sqlite.Tests/Qavren.Edge.Sqlite.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0

      - name: Cipher tests
        run: dotnet run --project foundation/tests/Qavren.Edge.Sqlite.Cipher.Tests/Qavren.Edge.Sqlite.Cipher.Tests.csproj -c Release -p:TargetFrameworks=net10.0

      - name: Onnx tests
        run: dotnet run --project embeddings/tests/Qavren.Edge.Onnx.Tests/Qavren.Edge.Onnx.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0

      - name: Embeddings tests
        run: dotnet run --project embeddings/tests/Qavren.Edge.Embeddings.Tests/Qavren.Edge.Embeddings.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0

      - name: VectorData tests
        run: dotnet run --project embeddings/tests/Qavren.Edge.VectorData.Tests/Qavren.Edge.VectorData.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0

      # Single-TFM project, so no -f. It is host-only and never runs on a device lane (spec 16.4).
      - name: VectorData conformance
        run: dotnet run --project embeddings/tests/Qavren.Edge.VectorData.Conformance.Tests/Qavren.Edge.VectorData.Conformance.Tests.csproj -c Release -p:TargetFrameworks=net10.0

      - name: Ingestion tests
        run: dotnet run --project ingestion/tests/Qavren.Edge.Ingestion.Tests/Qavren.Edge.Ingestion.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0

      - name: Ingestion extractor tests
        run: dotnet run --project ingestion/tests/Qavren.Edge.Ingestion.Extractors.Tests/Qavren.Edge.Ingestion.Extractors.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0

      # Single-TFM projects, so no -f. Both are host-only and never run on a device lane (spec 4.2).
      - name: Ingestion Onnx tests
        run: dotnet run --project ingestion/tests/Qavren.Edge.Ingestion.Onnx.Tests/Qavren.Edge.Ingestion.Onnx.Tests.csproj -c Release -p:TargetFrameworks=net10.0

      - name: Ingestion MEDI tests
        run: dotnet run --project ingestion/tests/Qavren.Edge.Ingestion.DataIngestion.Tests/Qavren.Edge.Ingestion.DataIngestion.Tests.csproj -c Release -p:TargetFrameworks=net10.0

      - name: Chat tests
        run: dotnet run --project chat/tests/Qavren.Edge.Chat.Tests/Qavren.Edge.Chat.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0

      # Single-TFM project, so no -f. It is host-only and never runs on a device lane (spec 16.4).
      - name: Rag tests
        run: dotnet run --project chat/tests/Qavren.Edge.Rag.Tests/Qavren.Edge.Rag.Tests.csproj -c Release -p:TargetFrameworks=net10.0

      - name: Pack
        if: matrix.os == 'windows-2025'
        run: dotnet pack QavrenEdge.slnx -c Release -o artifacts/packages

      - name: Assert every native RID reached the package
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = @(
            'win-x64','win-arm64','linux-x64','linux-arm64','osx-x64','osx-arm64',
            'maccatalyst-x64','maccatalyst-arm64','android-arm64','android-x64','android-arm')
          foreach ($pkg in 'Qavren.Edge.Sqlite.Native','Qavren.Edge.Sqlite.Native.Cipher') {
            $lib = if ($pkg -like '*Cipher') { 'qedge_sqlcipher' } else { 'qedge_sqlite3' }
            $nupkg = Get-ChildItem "artifacts/packages/$pkg.*.nupkg" | Select-Object -First 1
            $zip = [IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
            $names = $zip.Entries.FullName
            $zip.Dispose()
            foreach ($rid in $expected) {
              $hit = $names | Where-Object { $_ -like "runtimes/$rid/native/*$lib*" }
              if (-not $hit) { throw "$pkg is missing runtimes/$rid/native/ ($lib)" }
            }
            if (-not ($names | Where-Object { $_ -like "xcframeworks/$lib.xcframework/*" })) {
              throw "$pkg is missing the $lib xcframework"
            }
          }
          Write-Host 'OK: every expected RID and the xcframework are packed'

      - name: Assert package metadata (icon, README, tags)
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: ./foundation/tools/ci-checks/assert-packages.ps1

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-2025'
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  device-tests-android:
    needs: natives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'tree:0' }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-java@v4
        with: { distribution: microsoft, java-version: '21' }
      - uses: actions/download-artifact@v8
        with: { pattern: native-*, merge-multiple: true, path: foundation/native/artifacts }

      - run: dotnet workload install maui-android --version 10.0.201
      - run: dotnet tool restore

      - name: Install Android SDK packages
        run: dotnet android sdk install --package 'platform-tools' --package 'emulator' --package 'system-images;android-36;google_apis;x86_64'

      - name: Set AVD environment variables
        run: |
          mkdir -p "$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$HOME/.android" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL=1" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create and start emulator
        run: |
          dotnet android avd create --name QedgeEmulator --sdk 'system-images;android-36;google_apis;x86_64' --force
          dotnet android avd start -p 5554 --name QedgeEmulator --no-window --gpu swiftshader_indirect \
            --no-snapshot --no-audio --no-boot-anim --wait --no-animations --cpu-threshold 3 --response-threshold 5

      # NOT `dotnet test`: global.json pins the Microsoft.Testing.Platform runner, and the
      # DeviceRunners MAUI host is deliberately NOT an MTP application - DeviceRunners.Testing.Targets
      # sets IsTestingPlatformApplication=false so its own VSTest target can drive the device. MTP's
      # `dotnet test` therefore filters the project out and exits 1 with "No test projects were found."
      # Invoking that VSTest target directly is what `dotnet test` used to do here: Build -> deploy ->
      # launch -> TCP results -> TRX. %3B is an escaped ';' (MSBuild splits -p: values on a raw ';').
      - name: Run device tests
        run: >
          dotnet build foundation/tests/Qavren.Edge.DeviceTests/Qavren.Edge.DeviceTests.csproj
          -f net10.0-android -c Release -t:VSTest
          -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT
          -p:VSTestLogger=trx%3BLogFileName=android-device-tests.trx

      # Spec §13 requires JUnit. DeviceRunners writes TRX and has no JUnit writer, so the repo
      # converts (adjustment 30). The converter is unit-tested locally in Step 3.
      - name: Convert TRX to JUnit
        if: always()
        run: |
          python3 foundation/tools/trx2junit/trx2junit.py \
            --suite device-android \
            --out artifacts/junit/device-android.xml \
            $(find . -name 'android-device-tests.trx' -print)

      - name: Publish JUnit results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: device tests (android)
          path: artifacts/junit/*.xml
          reporter: java-junit
          fail-on-error: false

      # test-results/logcat.txt: when the app fails to launch or dies at startup the CLI writes no
      # TRX at all and the logcat it dumps is the only evidence of why. Without it this artifact
      # contains nothing but the checked-in trx2junit fixture.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-tests-android
          path: |
            **/*.trx
            artifacts/junit/*.xml
            **/test-results/logcat.txt

      - if: always()
        run: dotnet android avd delete --name QedgeEmulator --force || true

  device-tests-ios:
    needs: natives
    # On GitHub Actions macos-15 is ARM64; the certified iOS-simulator lane is x64/Rosetta.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'tree:0' }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.2' }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/download-artifact@v8
        with: { pattern: native-*, merge-multiple: true, path: foundation/native/artifacts }

      - run: dotnet workload install maui --version 10.0.201
      - run: dotnet tool restore

      - name: Create and boot a simulator
        run: |
          NAME="Qedge-$GITHUB_RUN_ID-ios"
          UDID=$(dotnet apple simulator create "$NAME" --device-type "iPhone 16" --format json | jq -r '.udid')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "SIMULATOR_NAME=$NAME" >> "$GITHUB_ENV"
          dotnet apple simulator boot "$UDID" --wait

      # VSTest target, not `dotnet test` - see device-tests-android for why.
      - name: Run device tests
        run: >
          dotnet build foundation/tests/Qavren.Edge.DeviceTests/Qavren.Edge.DeviceTests.csproj
          -f net10.0-ios -r iossimulator-x64 -c Release -t:VSTest
          -p:DeviceRunnersDevice=$SIMULATOR_UDID
          -p:VSTestLogger=trx%3BLogFileName=ios-device-tests.trx

      # Issue #13: the sample app head carries the same Apple native wiring (foundation/samples/Directory.Build.targets); link it here so it cannot silently rot.
      - name: Build sample (ios)
        run: dotnet build foundation/samples/Qavren.Edge.Sample/Qavren.Edge.Sample.csproj -f net10.0-ios -r iossimulator-x64 -c Release

      - name: Convert TRX to JUnit
        if: always()
        run: |
          python3 foundation/tools/trx2junit/trx2junit.py \
            --suite device-ios \
            --out artifacts/junit/device-ios.xml \
            $(find . -name 'ios-device-tests.trx' -print)

      - name: Publish JUnit results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: device tests (ios)
          path: artifacts/junit/*.xml
          reporter: java-junit
          fail-on-error: false

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-tests-ios
          path: |
            **/*.trx
            artifacts/junit/*.xml

      - if: always()
        run: dotnet apple simulator delete --force "$SIMULATOR_NAME" || true

  # Spec §13: "Mac Catalyst and Windows run the same app on their hosts." §14's "device tests x2"
  # is a stale count; §13 is the requirement (adjustment 29). Both lanes are cheap: neither boots
  # a simulator or an emulator.
  device-tests-maccatalyst:
    needs: natives
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'tree:0' }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.2' }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/download-artifact@v8
        with: { pattern: native-*, merge-multiple: true, path: foundation/native/artifacts }

      - run: dotnet workload install maui --version 10.0.201
      - run: dotnet tool restore

      # VSTest target, not `dotnet test` - see device-tests-android for why.
      - name: Run device tests
        run: >
          dotnet build foundation/tests/Qavren.Edge.DeviceTests/Qavren.Edge.DeviceTests.csproj
          -f net10.0-maccatalyst -r maccatalyst-x64 -c Release -t:VSTest
          -p:VSTestLogger=trx%3BLogFileName=maccatalyst-device-tests.trx

      # Issue #13: the sample app head carries the same Apple native wiring (foundation/samples/Directory.Build.targets); link it here so it cannot silently rot.
      - name: Build sample (maccatalyst)
        run: dotnet build foundation/samples/Qavren.Edge.Sample/Qavren.Edge.Sample.csproj -f net10.0-maccatalyst -r maccatalyst-x64 -c Release

      - name: Convert TRX to JUnit
        if: always()
        run: |
          python3 foundation/tools/trx2junit/trx2junit.py \
            --suite device-maccatalyst \
            --out artifacts/junit/device-maccatalyst.xml \
            $(find . -name 'maccatalyst-device-tests.trx' -print)

      - name: Publish JUnit results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: device tests (maccatalyst)
          path: artifacts/junit/*.xml
          reporter: java-junit
          fail-on-error: false

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-tests-maccatalyst
          path: |
            **/*.trx
            artifacts/junit/*.xml

  device-tests-windows:
    needs: natives
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'tree:0' }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/download-artifact@v8
        with: { pattern: native-*, merge-multiple: true, path: foundation/native/artifacts }

      - run: dotnet workload install maui --version 10.0.201
      - run: dotnet tool restore

      # VSTest target, not `dotnet test` - see device-tests-android for why.
      - name: Run device tests
        run: >
          dotnet build foundation/tests/Qavren.Edge.DeviceTests/Qavren.Edge.DeviceTests.csproj
          -f net10.0-windows10.0.19041.0 -c Release -t:VSTest
          -p:VSTestLogger=trx%3BLogFileName=windows-device-tests.trx

      - name: Convert TRX to JUnit
        if: always()
        shell: bash
        run: |
          python foundation/tools/trx2junit/trx2junit.py \
            --suite device-windows \
            --out artifacts/junit/device-windows.xml \
            $(find . -name 'windows-device-tests.trx' -print)

      - name: Publish JUnit results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: device tests (windows)
          path: artifacts/junit/*.xml
          reporter: java-junit
          fail-on-error: false

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-tests-windows
          path: |
            **/*.trx
            artifacts/junit/*.xml

  # Spec 17. Publishes the trim-smoke console trimmed and runs it: tokenize a fixed string, embed
  # it with the base64 fixture, and round-trip one vec0 upsert + search THROUGH
  # EdgeDynamicVectorStoreCollection - the reflection-free path, reached with GetDynamicCollection
  # and a VectorStoreCollectionDefinition, never GetCollection<TKey,TRecord>. The PublishAot
  # variant is continue-on-error for one release cycle and then either becomes required or the
  # AOT claim is dropped from the README.
  trim-smoke:
    needs: natives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'tree:0' }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/download-artifact@v8
        with: { pattern: native-*, merge-multiple: true, path: foundation/native/artifacts }

      - name: Publish trimmed
        run: >
          dotnet publish embeddings/tools/Qavren.Edge.TrimSmoke/Qavren.Edge.TrimSmoke.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishTrimmed=true -p:TargetFrameworks=net10.0 -p:TargetFramework=net10.0
          -o artifacts/trim-smoke

      - name: Run trimmed
        run: ./artifacts/trim-smoke/Qavren.Edge.TrimSmoke

      - name: Publish trimmed with both ingestion satellites
        continue-on-error: true
        run: >
          dotnet publish embeddings/tools/Qavren.Edge.TrimSmoke/Qavren.Edge.TrimSmoke.csproj
          -c Release -r linux-x64 --self-contained true -o ./artifacts/trim-smoke-satellites
          -p:PublishTrimmed=true -p:QedgeTrimSatellites=true
          -p:TargetFrameworks=net10.0 -p:TargetFramework=net10.0

      - name: Run the satellite trim smoke
        continue-on-error: true
        run: ./artifacts/trim-smoke-satellites/Qavren.Edge.TrimSmoke

      - name: Publish AOT
        continue-on-error: true
        run: >
          dotnet publish embeddings/tools/Qavren.Edge.TrimSmoke/Qavren.Edge.TrimSmoke.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishAot=true -p:TargetFrameworks=net10.0 -p:TargetFramework=net10.0
          -o artifacts/aot-smoke

      - name: Run AOT
        continue-on-error: true
        run: ./artifacts/aot-smoke/Qavren.Edge.TrimSmoke

  # Spec 16.3. Real int8 MiniLM, pinned to one HF revision, SHA-256 verified, cached on the
  # sha256 itself - not a URL, not a date, because a URL and a date both survive a content change
  # and the cache key is the only thing standing between a silently-swapped model and a green
  # nightly. Never on a PR: schedule and workflow_dispatch only. NOT in ci-gate's needs.
  model-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Ingestion.Tests loads qedge_sqlite3 (vec0, FTS5), and the only way that library reaches
    # this runner is the native-* artifacts `natives` uploads. Without this edge the job started
    # alongside `natives`, the download below found 0 artifacts, and 120 SQLite-backed tests
    # failed on load - every nightly from the SP3 merge (9aed0e0) to run 34969457254. The `if`
    # above carries an implicit success(), so a red `natives` skips this job rather than running it.
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QAVREN_EDGE_MODEL_REPO: sentence-transformers/all-MiniLM-L6-v2
      QAVREN_EDGE_MODEL_REV: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      QAVREN_EDGE_MODEL_SHA256: 4278337fd0ff3c68bfb6291042cad8ab363e1d9fbc43dcb499fe91c871902474
      QAVREN_EDGE_VOCAB_SHA256: 07eced375cec144d27c900241f3e339478dec958f92fddbc551f295c992038a3
      QAVREN_EDGE_MODEL_DIR: ${{ github.workspace }}/.model-cache
      QAVREN_EDGE_DOCS_DIR: ${{ github.workspace }}/.docs-cache
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'tree:0' }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/download-artifact@v8
        with: { pattern: native-*, merge-multiple: true, path: foundation/native/artifacts }

      # Keyed on the CONTENT hash. A key containing the revision would still be stale if the
      # revision were ever repointed; a key containing a date would miss every day.
      - uses: actions/cache@v6.1.0
        id: model-cache
        with:
          path: ${{ env.QAVREN_EDGE_MODEL_DIR }}
          key: qavren-edge-model-${{ env.QAVREN_EDGE_MODEL_SHA256 }}

      - name: Fetch the pinned model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$QAVREN_EDGE_MODEL_DIR/onnx"
          base="https://huggingface.co/$QAVREN_EDGE_MODEL_REPO/resolve/$QAVREN_EDGE_MODEL_REV"
          curl -fsSL "$base/onnx/model_qint8_arm64.onnx" -o "$QAVREN_EDGE_MODEL_DIR/onnx/model_qint8_arm64.onnx"
          curl -fsSL "$base/vocab.txt" -o "$QAVREN_EDGE_MODEL_DIR/vocab.txt"

      # Verified on EVERY run, cache hit included. A poisoned or truncated cache entry is exactly
      # the failure this lane would otherwise report as a numerical regression.
      - name: Verify the model hashes
        run: |
          set -euo pipefail
          echo "$QAVREN_EDGE_MODEL_SHA256  $QAVREN_EDGE_MODEL_DIR/onnx/model_qint8_arm64.onnx" | sha256sum -c -
          echo "$QAVREN_EDGE_VOCAB_SHA256  $QAVREN_EDGE_MODEL_DIR/vocab.txt" | sha256sum -c -

      # QAVREN_EDGE_MODEL_DIR is what SkipUnless reads. It is set for the whole job, so the tier-3
      # facts run; on every other lane it is unset and they skip at RUNTIME, after the class
      # constructor, which is why the session is built inside the test body (spec 16.3).
      - name: Tier-3 embedding tests
        run: dotnet run --project embeddings/tests/Qavren.Edge.Embeddings.Tests/Qavren.Edge.Embeddings.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0

      # Real-world document lane. Fetches by pinned SHA-256 into the same content-hash cache and
      # commits nothing; the manifest (Task 1.3 Step 6b) is a committed file with a schema, not a
      # URL in a YAML comment (plan adjustment 26). An empty manifest is a visible ::warning::, not
      # a silent no-op, and a wrong digest fails the job loudly.
      - name: Fetch the real-world document corpus
        shell: bash
        run: |
          set -euo pipefail
          manifest=ingestion/tests/fixtures/realworld-corpus.json
          mkdir -p "$QAVREN_EDGE_DOCS_DIR"
          count=$(jq '.documents | length' "$manifest")
          if [ "$count" -eq 0 ]; then
            echo "::warning title=Spec 14.5 owed::realworld-corpus.json is empty; the real-world document lane asserts nothing. Add entries to ingestion/tests/fixtures/realworld-corpus.json."
            exit 0
          fi
          jq -r '.documents[] | [.id, .url, .sha256] | @tsv' "$manifest" |
          while IFS=$'\t' read -r id url sha; do
            out="$QAVREN_EDGE_DOCS_DIR/$id"
            curl -fsSL --retry 3 -o "$out" "$url"
            echo "$sha  $out" | sha256sum -c -
          done
          echo "fetched $count real-world documents"

      # QAVREN_EDGE_DOCS_DIR is a JOB env (below, with QAVREN_EDGE_MODEL_DIR) and the fetch step
      # runs BEFORE this one: RealWorldIngestionTests reads $QAVREN_EDGE_DOCS_DIR/<id> and skips
      # with a printed reason when the variable is unset, so the earlier order - fetch after the
      # test, variable scoped to the fetch step - made the real-world lane skip on every run.
      - name: Ingestion tier-3 (real model)
        run: dotnet run --project ingestion/tests/Qavren.Edge.Ingestion.Tests/Qavren.Edge.Ingestion.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0
        env:
          QAVREN_EDGE_TIER3: '1'

  # Spec 16.3. The real model, nightly only. Qwen3 0.6B int4 - the smallest genai-config-ready
  # model, Apache-2.0 so its presence in a CI cache is not a licensing question, and the one whose
  # KV-heavy geometry (112 KiB/token, measured) the budget most needs to be right about. Keyed on
  # the CONTENT hash, and sha256sum -c runs on EVERY run including cache hits: a poisoned cache
  # entry is exactly the failure this lane would otherwise report as a quality regression.
  chat-model-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QAVREN_EDGE_CHAT_MODEL_REPO: Arm/qwen3-0-6b-onnx-genai-int4-kquantlast-emb-int4
      QAVREN_EDGE_CHAT_MODEL_REV: c1d7bbbbb20630eef24c00d8ad18250bd57b232c
      QAVREN_EDGE_CHAT_MODEL_SHA256: 52640ca0d65e00d33dfb10b822c6a41e31bab1aaa6a49457b1dc5952c0dab0fb
      QAVREN_EDGE_CHAT_GRAPH_SHA256: e9208ab7164ea6da0206eec2a2f0996a24e75d164f85823b02111f23046aab89
      QAVREN_EDGE_CHAT_TOKENIZER_SHA256: be75606093db2094d7cd20f3c2f385c212750648bd6ea4fb2bf507a6a4c55506
      QAVREN_EDGE_CHAT_MODEL_DIR: ${{ github.workspace }}/.chat-model-cache
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'tree:0' }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }

      - uses: actions/cache@v6.1.0
        id: chat-model-cache
        with:
          path: ${{ env.QAVREN_EDGE_CHAT_MODEL_DIR }}
          key: qavren-edge-chat-model-${{ env.QAVREN_EDGE_CHAT_MODEL_SHA256 }}

      - name: Fetch the pinned chat model
        if: steps.chat-model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$QAVREN_EDGE_CHAT_MODEL_DIR"
          base="https://huggingface.co/$QAVREN_EDGE_CHAT_MODEL_REPO/resolve/$QAVREN_EDGE_CHAT_MODEL_REV"
          for f in genai_config.json model.onnx model.onnx.data tokenizer.json tokenizer_config.json chat_template.jinja; do
            curl -fsSL "$base/$f" -o "$QAVREN_EDGE_CHAT_MODEL_DIR/$f"
          done

      - name: Verify the model hashes
        run: |
          set -euo pipefail
          echo "$QAVREN_EDGE_CHAT_GRAPH_SHA256  $QAVREN_EDGE_CHAT_MODEL_DIR/model.onnx" | sha256sum -c -
          echo "$QAVREN_EDGE_CHAT_MODEL_SHA256  $QAVREN_EDGE_CHAT_MODEL_DIR/model.onnx.data" | sha256sum -c -
          echo "$QAVREN_EDGE_CHAT_TOKENIZER_SHA256  $QAVREN_EDGE_CHAT_MODEL_DIR/tokenizer.json" | sha256sum -c -

      # QAVREN_EDGE_CHAT_MODEL_DIR is what SkipUnless reads, at RUNTIME. It is set for the whole
      # job, so the tier-3 facts run; on every other lane it is unset and they skip after the class
      # constructor, which is why the model is loaded inside the test body (spec 16.3).
      - name: Tier-3 chat tests
        run: dotnet run --project chat/tests/Qavren.Edge.Chat.Tests/Qavren.Edge.Chat.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-model-tests
          path: artifacts/chat-nightly/**

  # The required status check for ci (adjustment 28). It always reports; it is red if any job
  # it depends on failed or was cancelled, green if they all succeeded or were skipped.
  ci-gate:
    needs: [natives, test, trim-smoke, device-tests-android, device-tests-ios, device-tests-maccatalyst, device-tests-windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "ci-gate: FAIL ($r)"; exit 1 ;;
            esac
          done
          echo "ci-gate: pass"
