name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Nothing may write, or mint an OIDC token, unless its own job says so. Only `publish` does.
permissions:
  contents: read

jobs:
  # Rebuild the natives from the tagged commit rather than trusting a stale artifact, so the
  # binaries in the Release are provably the ones the packages were built from. No `force`
  # input exists any more (adjustment 34) and none is needed: a tag push is not a
  # `pull_request`, so native.yml's `build` matrix always runs here. The artifact cache still
  # short-circuits the compile when the tagged native tree is byte-identical to what `main`
  # already built, which is the normal case for a release cut from a green main.
  natives:
    uses: ./.github/workflows/native.yml
    # native.yml's `reuse` job asks for `actions: read` to repair a missing cache entry from the last
    # good run's artifact. The top-level `contents: write` above leaves every other scope at none,
    # and a called workflow cannot widen the caller's token: without this grant the run dies at
    # startup ("startup_failure", run 34715152977) before a single job is scheduled.
    permissions:
      contents: read
      actions: read

  # Builds everything a release consists of and hands it to `publish` as one artifact. It holds
  # no `id-token: write` and no `contents: write`, on purpose: this is the job that restores every
  # NuGet package the solution references and runs their build targets, and the SBOM action. None
  # of that can mint the token nuget.org trusts, or touch the repository, from here.
  pack:
    needs: natives
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # MinVer derives the version from tags
          filter: tree:0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: foundation/native/artifacts

      - name: Pack
        run: dotnet pack QavrenEdge.slnx -c Release -o artifacts/packages

      - name: Assert package metadata (icon, README, tags)
        shell: pwsh
        run: ./foundation/tools/ci-checks/assert-packages.ps1

      # One zip per build host keeps the release page readable.
      - name: Zip the native artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/native | Out-Null
          Compress-Archive -Path foundation/native/artifacts/win-* -DestinationPath artifacts/native/qedge-native-windows.zip
          Compress-Archive -Path foundation/native/artifacts/linux-*, foundation/native/artifacts/android-* -DestinationPath artifacts/native/qedge-native-linux-android.zip
          Compress-Archive -Path foundation/native/artifacts/apple, foundation/native/artifacts/osx-*, foundation/native/artifacts/maccatalyst-* -DestinationPath artifacts/native/qedge-native-apple.zip
          Get-ChildItem artifacts/native

      # syft scans the whole artifacts/ tree, so one document covers both the packages and the
      # native binaries.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: artifacts
          format: spdx-json
          output-file: artifacts/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Computed last, so it covers the packages, the native zips AND the SBOM.
      - name: Checksums
        shell: pwsh
        run: |
          $nupkg  = @(Get-ChildItem artifacts/packages/*.nupkg)
          $snupkg = @(Get-ChildItem artifacts/packages/*.snupkg)
          $zips   = @(Get-ChildItem artifacts/native/*.zip)
          if ($nupkg.Count -ne 17) { throw "expected 17 .nupkg, found $($nupkg.Count)" }
          if ($snupkg.Count -ne 17) { throw "expected 17 .snupkg, found $($snupkg.Count)" }
          if ($zips.Count -ne 3)    { throw "expected 3 native zips, found $($zips.Count)" }
          if (-not (Test-Path artifacts/sbom.spdx.json)) { throw "artifacts/sbom.spdx.json is missing" }
          $files = $nupkg + $snupkg + $zips + @(Get-Item artifacts/sbom.spdx.json)
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, $_.Name } |
            Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      # The hand-over. On workflow_dispatch this is where the run ends: the dry run's would-be
      # release assets, inspectable as `release-dry-run`. On a tag it is `release-assets`, the only
      # thing `publish` takes from this job. The paths share `artifacts/` as their root, so the
      # artifact holds packages/, native/, sbom.spdx.json and SHA256SUMS.txt.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-assets' || 'release-dry-run' }}
          if-no-files-found: error
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/native/*.zip
            artifacts/sbom.spdx.json
            artifacts/SHA256SUMS.txt

  # The only job that can publish, and it builds nothing: it downloads what `pack` produced,
  # checks it against the checksum file `pack` wrote, pushes and creates the release. A tag is the
  # only way in; workflow_dispatch never reaches it.
  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    # OIDC trusted publishing, no long-lived key and no secret: the policy on nuget.org (owner
    # Qavren, repository qavren-oss/qavren-edge, workflow release.yml) lets NuGet/login exchange
    # the GitHub OIDC token for a one-hour API key at publish time. id-token: write is what mints
    # that token, and contents: write is what creates the GitHub release.
    permissions:
      contents: write
      id-token: write
    steps:
      # For global.json only. Nothing from the checkout is built or run in this job.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: artifacts

      # The files this job is about to publish are the files `pack` hashed: the same count, the
      # same names, the same bytes.
      - name: Verify the hand-over against SHA256SUMS
        shell: pwsh
        run: |
          $lines = @(Get-Content artifacts/SHA256SUMS.txt | Where-Object { $_ })
          if ($lines.Count -ne 38) { throw "expected 38 checksum lines (17 .nupkg, 17 .snupkg, 3 zips, the SBOM), found $($lines.Count)" }
          foreach ($line in $lines) {
            $hash, $name = $line -split '  ', 2
            $file = @(Get-ChildItem artifacts -Recurse -File -Filter $name)
            if ($file.Count -ne 1) { throw "expected exactly one '$name' in the artifact, found $($file.Count)" }
            $actual = (Get-FileHash $file[0].FullName -Algorithm SHA256).Hash
            if ($actual -ne $hash) { throw "$name does not match SHA256SUMS.txt" }
          }
          "verified $($lines.Count) files"

      # One push per package, enumerated by PowerShell: on the Windows runner `dotnet nuget push`
      # does not expand a forward-slash glob ("File does not exist (artifacts/packages/*.nupkg)",
      # run 34721241400). The matching .snupkg beside each .nupkg is pushed with it.
      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: stevenfackley

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem artifacts/packages/*.nupkg)
          if ($packages.Count -ne 17) { throw "expected 17 .nupkg to push, found $($packages.Count)" }
          foreach ($pkg in $packages) {
            dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "push failed for $($pkg.Name)" }
          }

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/native/*.zip
            artifacts/sbom.spdx.json
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
