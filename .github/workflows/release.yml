name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Rebuild the natives from the tagged commit rather than trusting a stale artifact, so the
  # binaries in the Release are provably the ones the packages were built from. No `force`
  # input exists any more (adjustment 34) and none is needed: a tag push is not a
  # `pull_request`, so native.yml's `build` matrix always runs here. The artifact cache still
  # short-circuits the compile when the tagged native tree is byte-identical to what `main`
  # already built, which is the normal case for a release cut from a green main.
  natives:
    uses: ./.github/workflows/native.yml
    # native.yml's `reuse` job asks for `actions: read` to repair a missing cache entry from the last
    # good run's artifact. The top-level `contents: write` above leaves every other scope at none,
    # and a called workflow cannot widen the caller's token: without this grant the run dies at
    # startup ("startup_failure", run 34715152977) before a single job is scheduled.
    permissions:
      contents: read
      actions: read

  release:
    needs: natives
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # MinVer derives the version from tags
          filter: tree:0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: foundation/native/artifacts

      - name: Pack
        run: dotnet pack QavrenEdge.slnx -c Release -o artifacts/packages

      - name: Assert package metadata (icon, README, tags)
        shell: pwsh
        run: ./foundation/tools/ci-checks/assert-packages.ps1

      # One zip per build host keeps the release page readable.
      - name: Zip the native artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/native | Out-Null
          Compress-Archive -Path foundation/native/artifacts/win-* -DestinationPath artifacts/native/qedge-native-windows.zip
          Compress-Archive -Path foundation/native/artifacts/linux-*, foundation/native/artifacts/android-* -DestinationPath artifacts/native/qedge-native-linux-android.zip
          Compress-Archive -Path foundation/native/artifacts/apple, foundation/native/artifacts/osx-*, foundation/native/artifacts/maccatalyst-* -DestinationPath artifacts/native/qedge-native-apple.zip
          Get-ChildItem artifacts/native

      # syft scans the whole artifacts/ tree, so one document covers both the packages and the
      # native binaries.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: artifacts
          format: spdx-json
          output-file: artifacts/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Computed last, so it covers the packages, the native zips AND the SBOM.
      - name: Checksums
        shell: pwsh
        run: |
          $nupkg  = @(Get-ChildItem artifacts/packages/*.nupkg)
          $snupkg = @(Get-ChildItem artifacts/packages/*.snupkg)
          $zips   = @(Get-ChildItem artifacts/native/*.zip)
          if ($nupkg.Count -ne 17) { throw "expected 17 .nupkg, found $($nupkg.Count)" }
          if ($snupkg.Count -ne 17) { throw "expected 17 .snupkg, found $($snupkg.Count)" }
          if ($zips.Count -ne 3)    { throw "expected 3 native zips, found $($zips.Count)" }
          if (-not (Test-Path artifacts/sbom.spdx.json)) { throw "artifacts/sbom.spdx.json is missing" }
          $files = $nupkg + $snupkg + $zips + @(Get-Item artifacts/sbom.spdx.json)
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, $_.Name } |
            Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      # workflow_dispatch is the dry run: everything above ran, nothing below does, and the
      # would-be release assets are inspectable as a workflow artifact.
      - uses: actions/upload-artifact@v7
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: release-dry-run
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/native/*.zip
            artifacts/sbom.spdx.json
            artifacts/SHA256SUMS.txt

      # One push per package, enumerated by PowerShell: on the Windows runner `dotnet nuget push`
      # does not expand a forward-slash glob ("File does not exist (artifacts/packages/*.nupkg)",
      # run 34721241400). The matching .snupkg beside each .nupkg is pushed with it.
      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem artifacts/packages/*.nupkg)
          if ($packages.Count -ne 17) { throw "expected 17 .nupkg to push, found $($packages.Count)" }
          foreach ($pkg in $packages) {
            dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "push failed for $($pkg.Name)" }
          }

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/native/*.zip
            artifacts/sbom.spdx.json
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
